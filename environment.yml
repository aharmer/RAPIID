# Development and build environment for RAPIID.
#   conda env create -f environment.yml
#   conda activate rapiid
# Run from the repository root: the Spinnaker wheel below is a relative path.
#
# Lists only what RAPIID imports or needs to build, pinned to the versions the
# current release is built and tested with. Transitive dependencies are left to
# the solver.
name: rapiid
channels:
  - conda-forge
dependencies:
  # Python 3.8 is fixed by the Spinnaker wheel, which is built for cp38 only.
  - python=3.8.13
  # setup.py copies zlib.dll from the environment into the frozen build; the
  # app will not start on a clean machine without it.
  - libzlib
  - pip
  - pip:
    # Application
    - PyQt5==5.15.11
    # Headless: the GUI is PyQt5, so OpenCV's own windowing is not needed.
    # 4.8+ provides cv2.barcode (1D barcodes) without the contrib package.
    - opencv-python-headless==4.13.0.92
    - numpy==1.24.4
    - pylibdmtx==0.1.10
    - pillow==10.4.0
    - piexif==1.1.3
    - PyYAML==6.0.3
    # Keep at 2.12 - qt-material 2.14.2 dropped PyQt5 support.
    # Newer versions silently fail to theme (no icons, no fonts) and emit
    # "qt_material must be imported after PySide or PyQt!".
    - qt-material==2.12
    # FLIR camera support. Also needs the Spinnaker SDK driver installed
    # separately; see README.
    - spinnaker_python-2.7.0.128-cp38-cp38-win_amd64.whl
    # Build
    - cx_Freeze==7.2.10
